# Overrides for the OpenShift Developer Sandbox.
# The image is built inside the cluster and stored in its internal registry.
image:
  repository: image-registry.openshift-image-registry.svc:5000/claarke-dev/flight-service
  tag: "0.2"   # built before the database change; rebuild before enabling db there

route:
  enabled: true

# The PostgreSQL pod is only checked on kind. The sandbox runs containers with a random user ID,
# which the stock postgres image needs extra settings for, so the database stays off there for now.
db:
  enabled: false
