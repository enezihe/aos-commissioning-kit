# Default values for the flight-service chart.
# Each environment (kind, OpenShift) can override these with its own file or --set.

replicaCount: 2            # how many pods to keep running

image:
  repository: flight-service
  tag: "0.4"
  pullPolicy: IfNotPresent # use the image already present on the node

containerPort: 8000        # port uvicorn listens on inside the container

service:
  port: 80                 # port other workloads use to reach the Service

resources:
  requests:                # the minimum the pod needs
    cpu: 50m
    memory: 64Mi
  limits:                  # the most the pod may use
    cpu: 200m
    memory: 128Mi

route:
  enabled: false     # OpenShift only; kind has no Route resource

config:
  enabled: true                  # mount the airport config so the service can check gates
  configMapName: airport-config  # the live ConfigMap that aos-config upload maintains
  mountPath: /etc/aos            # the file appears as /etc/aos/airport.yaml

metrics:
  # Both need the Prometheus Operator in the cluster (see observability/README.md), so they are
  # off by default: the chart must still install on a cluster that has no monitoring.
  serviceMonitor:
    enabled: false               # tell Prometheus to scrape every pod behind the Service
    interval: 15s                # how often Prometheus asks /metrics
  dashboard:
    enabled: false               # ship the Grafana dashboard as a ConfigMap that Grafana picks up

db:
  enabled: true                  # run PostgreSQL next to the service so replicas share flights
  serviceName: flight-db         # the name the service uses to reach the database
  secretName: flight-db          # Secret with POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
                                 # Create it before installing; the chart never holds the password.
  image:
    repository: postgres
    tag: 16-alpine
  storage: 1Gi                   # size of the disk that keeps the data
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
