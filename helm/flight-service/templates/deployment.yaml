# Deployment: tells Kubernetes how many copies (pods) of the service must run.
# If a pod dies, Kubernetes creates a new one automatically (self-healing).
# The values written with double curly braces below come from values.yaml (the "blanks" in the recipe card).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: flight-service      # which pods this Deployment manages
  template:                    # the blueprint for every pod
    metadata:
      labels:
        app: flight-service    # must match selector.matchLabels above
    spec:
      containers:
        - name: flight-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          # Readiness: only send traffic once the app answers. With a database, /ready also
          # checks that the database answers, so a pod that cannot reach it gets no traffic.
          readinessProbe:
            httpGet:
              path: {{ if .Values.db.enabled }}/ready{{ else }}/health{{ end }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: restart the container if /health stops answering.
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          # requests = what the pod needs at least, limits = the most it may use.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.config.enabled .Values.db.enabled }}
          env:
            {{- if .Values.config.enabled }}
            # The service reads the airport config from this file to check gates.
            - name: AOS_CONFIG_PATH
              value: {{ .Values.config.mountPath }}/airport.yaml
            {{- end }}
            {{- if .Values.db.enabled }}
            # Where the database is. Not secret, so it lives in the chart.
            - name: DB_HOST
              value: {{ .Values.db.serviceName }}
            - name: DB_PORT
              value: "5432"
            # The login comes from a Secret that exists before the install. It is not in the
            # image and not in the chart values. If the Secret is missing, the pod stays in
            # CreateContainerConfigError (see docs/incidents/07).
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_DB
            {{- end }}
          {{- end }}
          {{- if .Values.config.enabled }}
          volumeMounts:
            - name: airport-config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.config.enabled }}
      volumes:
        - name: airport-config
          configMap:
            name: {{ .Values.config.configMapName }}
            optional: true         # pods still start if no config was uploaded yet
      {{- end }}
