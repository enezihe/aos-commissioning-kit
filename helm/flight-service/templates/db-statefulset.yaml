{{- if .Values.db.enabled }}
# PostgreSQL for the flight data. A StatefulSet (not a Deployment) because the pod owns a disk:
# if the pod is deleted, the new pod gets the same disk back, so the data survives.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.db.serviceName }}
spec:
  serviceName: {{ .Values.db.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.db.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.db.serviceName }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: 5432
          env:
            # User, password and database name come from the same Secret the service reads.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_DB
            # A sub-folder, because a fresh volume root is not empty and PostgreSQL refuses it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.db.storage }}
{{- end }}
